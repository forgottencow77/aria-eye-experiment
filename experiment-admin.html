<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>管理者ページ | ARIA</title>
<link rel="stylesheet" href="/experiment.css">
<style>
body.admin-slim { background:#f6f7f9 }
.admin-slim .header-inner,.admin-slim main { max-width:900px }
.admin-slim main { padding:22px 16px 48px }
.admin-slim .admin-content { min-height:0; padding:0; background:transparent }
.admin-slim .card,.admin-slim .advanced-panel { margin:0 0 14px; padding:22px 24px; background:#fff; border:1px solid var(--line); }
.admin-slim .card { border-bottom:1px solid var(--line) }
.admin-slim h1 { margin:0 0 16px; font-size:24px }
.admin-slim h2 { font-size:18px; margin:0 0 14px }
.admin-slim .advanced-panel>summary { cursor:pointer; font-weight:600 }
.admin-slim .advanced-panel[open]>summary { margin-bottom:16px }
.admin-slim #config { min-height:280px }
.admin-slim #createdSession { margin-top:12px }
.admin-slim #createdSession .alert { margin:8px 0 0 }
.admin-slim .session { gap:10px }
.admin-slim .table-wrap { margin-top:12px }
.admin-slim .row label { min-width:76px }
.admin-slim .status { margin-top:10px }
@media(max-width:650px) {
 .admin-slim .card,.admin-slim .advanced-panel { padding:18px 16px }
 .admin-slim .row input { min-width:0; width:100% }
}
</style>
</head>
<body class="admin-slim">
<header><div class="header-inner"><div class="brand">管理者ページ</div><span class="tag">実機モードは開始前に選択</span></div></header>

<main><div class="admin-content">
<section class="card" aria-labelledby="createTitle">
  <h1 id="createTitle">新しい実験</h1>
  <div class="row"><label for="participantId">参加者ID</label><input id="participantId" autocomplete="off" maxlength="64" placeholder="P001"></div>
  <div class="row"><label for="mode">種別</label><select id="mode"><option value="pilot">予備実験</option><option value="main">本実験</option></select></div>
  <div class="row"><label for="hardwareMode">提示先</label><select id="hardwareMode"><option value="mock">動作確認（実機を動かさない）</option><option value="hardware">実機（Piを動かす）</option></select><button class="button secondary" id="checkHardware">実機の接続確認</button></div><p id="hardwareStatus" class="status" role="status"></p>
  <button class="button" id="createSession">作成する</button>
  <div id="createStatus" class="status" role="status"></div>
  <div id="createdSession"></div>
</section>
<section class="card" aria-labelledby="sessionsTitle">
  <h2 id="sessionsTitle">保存済みセッション</h2>
  <div id="sessions" class="muted">読み込み中…</div>
</section>
<details class="advanced-panel" id="advancedSettings">
  <summary>詳細設定</summary>
  <p class="muted" id="sourceNote">Piに保存された設定を読み込み中…</p><p class="muted">回答に正解判定はありません。同じ物理状態IDの提示枠は同じ見た目としてまとめて分析してください。</p>
  <label for="config">表情設定（JSON）</label>
  <textarea id="config" aria-label="6感情と共通基準の設定JSON" spellcheck="false"></textarea>
  <div class="row"><button class="button secondary" id="checkConfig">条件を更新</button></div>
  <div id="configStatus" class="status" role="status"></div>
  <div id="conditionStats" class="stats"></div>
  <div id="duplicates"></div>
  <details style="margin-top:18px">
    <summary>42条件の一覧</summary>
    <div id="slots" class="table-wrap"></div>
  </details>
</details>
<details class="advanced-panel" id="connectionSettings">
  <summary>接続設定</summary>
  <div class="row"><label for="adminToken">管理キー（任意）</label><input id="adminToken" type="password" autocomplete="off" placeholder="必要な場合のみ"><button class="button secondary" id="connectAdmin">再読み込み</button></div>
  <p class="muted">通常は空欄で使えます。設定されている場合だけ入力してください。</p>
</details>
</div></main>
<script>
const $=id=>document.getElementById(id);let defaultConfig=null;let validatedConfig=null;
const names={anger:'怒り',disgust:'嫌悪',fear:'恐れ',joy:'喜び',sadness:'悲しみ',surprise:'驚き'};
async function api(path,body){const headers={...(body===undefined?{}:{'Content-Type':'application/json'})};const token=$('adminToken')?.value||sessionStorage.getItem('aria-experiment-admin-token')||'';if(token)headers['X-Aria-Admin-Token']=token;const response=await fetch(path,{method:body===undefined?'GET':'POST',headers,body:body===undefined?undefined:JSON.stringify(body)});const value=await response.json();if(!response.ok||!value.ok)throw new Error(value.error||`HTTP ${response.status}`);return value}
function hsvHex([h,s,v]){s/=100;v/=100;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;const rgb=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return '#'+rgb.map(n=>Math.round((n+m)*255).toString(16).padStart(2,'0')).join('').toUpperCase()}
function mergeSavedBrowserSettings(config){try{const saved=JSON.parse(localStorage.getItem('aria-emotion-settings-v2')||'{}');for(const [id,value] of Object.entries(saved)){if(config.emotions[id]&&Array.isArray(value.hsv)&&value.hsv.length===3){config.emotions[id].iris_hex=hsvHex(value.hsv);config.emotions[id].eyelid_open_percent=Math.round(Number(value.lid)*100);config.emotions[id].gaze_horizontal_deg=Number(value.gaze?.[0]);config.emotions[id].gaze_vertical_deg=Number(value.gaze?.[1]);}}return Object.keys(saved).length>0}catch{return false}}
function readConfig(){const value=JSON.parse($('config').value);if(!value||Object.keys(value).sort().join(',')!=='emotions,neutral'||Object.keys(value.emotions).sort().join(',')!==Object.keys(names).sort().join(','))throw new Error('neutral と6感情のJSON構造を確認してください。');for(const [id,row] of [['共通基準',value.neutral],...Object.entries(value.emotions).map(([id,row])=>[names[id],row])]){if(!/^#[0-9a-fA-F]{6}$/.test(row.iris_hex))throw new Error(`${id}: 虹彩色は #RRGGBB 形式にしてください。`);for(const key of ['eyelid_open_percent','gaze_horizontal_deg','gaze_vertical_deg'])if(!Number.isInteger(row[key]))throw new Error(`${id}: ${key} は整数で入力してください。`);if(row.eyelid_open_percent<0||row.eyelid_open_percent>100||row.gaze_horizontal_deg< -20||row.gaze_horizontal_deg>20||row.gaze_vertical_deg< -20||row.gaze_vertical_deg>20)throw new Error(`${id}: 上瞼0〜100、視線±20の範囲を確認してください。`)}return value}
function state(config,id,factors){const b=config.neutral,e=config.emotions[id];return {iris_hex:factors.includes('C')?e.iris_hex:b.iris_hex,eyelid_open_percent:factors.includes('L')?e.eyelid_open_percent:b.eyelid_open_percent,gaze_horizontal_deg:factors.includes('G')?e.gaze_horizontal_deg:b.gaze_horizontal_deg,gaze_vertical_deg:factors.includes('G')?e.gaze_vertical_deg:b.gaze_vertical_deg}}
function renderConfig(){try{const config=readConfig();validatedConfig=config;$('configStatus').textContent='設定形式と範囲を確認しました。42枠を生成できます。';$('configStatus').className='status';renderSlots(config)}catch(error){validatedConfig=null;$('configStatus').textContent=error.message;$('configStatus').className='status error';$('slots').replaceChildren();$('conditionStats').replaceChildren();$('duplicates').replaceChildren()}}
function canonical(values){return JSON.stringify(Object.fromEntries(Object.keys(values).sort().map(key=>[key,values[key]])))}
function physicalId(values){let hash=14695981039346656037n;for(const byte of new TextEncoder().encode(canonical(values))){hash^=BigInt(byte);hash=BigInt.asUintN(64,hash*1099511628211n)}return 'phys_'+hash.toString(16).padStart(16,'0')}
function renderSlots(config){const factors=['C','L','G','CL','CG','LG','CLG'];const all=[];for(const id of Object.keys(names))for(const factor of factors){const values=state(config,id,factor);const key=canonical(values);all.push({slot:id+'__'+factor,id,factor,values,key,physical_state_id:physicalId(values)})}const groups=new Map();for(const row of all)groups.set(row.key,[...(groups.get(row.key)||[]),row.slot]);const dup=[...groups.values()].filter(group=>group.length>1);$('conditionStats').innerHTML=`<span class="stat">提示枠 <strong>${all.length}</strong></span><span class="stat">異なる物理状態 <strong>${groups.size}</strong></span><span class="stat">物理状態の重複グループ <strong>${dup.length}</strong></span>`;$('duplicates').replaceChildren();if(dup.length){const heading=document.createElement('h3');heading.textContent='物理状態が同じ枠';$('duplicates').append(heading);for(const group of dup){const item=document.createElement('div');item.className='duplicate';item.textContent=group.join(' ＝ ');$('duplicates').append(item)}}else{$('duplicates').textContent='重複する物理状態はありません。'}const table=document.createElement('table');table.innerHTML='<thead><tr><th>提示枠</th><th>設定元の感情</th><th>要素</th><th>実際のUI設定</th><th>物理状態ID</th></tr></thead>';const body=document.createElement('tbody');for(const row of all){const tr=document.createElement('tr');const values=row.values;for(const cell of [row.slot,names[row.id],row.factor,`${values.iris_hex} · lid ${values.eyelid_open_percent}% · X ${values.gaze_horizontal_deg}° · Y ${values.gaze_vertical_deg}°`,row.physical_state_id]){const td=document.createElement('td');td.textContent=cell;tr.append(td)}body.append(tr)}table.append(body);$('slots').replaceChildren(table)}
function bindExport(link){link.addEventListener('click',async event=>{event.preventDefault();try{const token=$('adminToken').value||sessionStorage.getItem('aria-experiment-admin-token')||'';const response=await fetch(link.href,{headers:{'X-Aria-Admin-Token':token}});if(!response.ok){const body=await response.json();throw new Error(body.error||'エクスポートに失敗しました。')}const blob=await response.blob();const temporary=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=temporary;anchor.download=link.dataset.filename;anchor.click();setTimeout(()=>URL.revokeObjectURL(temporary),1000)}catch(error){$('createStatus').textContent=error.message;$('createStatus').className='status error'}})}
async function refreshSessions(){const data=await api('/api/experiment/sessions');const root=$('sessions');root.replaceChildren();if(!data.sessions.length){root.textContent='保存済みセッションはありません。';return}for(const session of data.sessions){const row=document.createElement('div');row.className='session';const info=document.createElement('div');info.innerHTML='<div class="session-title"></div><div class="muted"></div>';info.firstChild.textContent=session.participant_id+' · '+(session.mode==='pilot'?'予備実験':'本実験')+' · '+(session.hardware_mode==='hardware'?'実機':'動作確認')+' · '+session.status;info.lastChild.textContent=session.session_id+' · 設定 '+session.configuration_version+' · '+(session.next_index??0)+'/42';const actions=document.createElement('div');actions.className='session-actions';const participant=document.createElement('a');participant.href=session.participant_url;participant.textContent='回答画面';const csv=document.createElement('a');csv.href='/api/experiment/export/'+encodeURIComponent(session.session_id)+'.csv';csv.dataset.filename=session.session_id+'.csv';csv.textContent='CSV';bindExport(csv);const json=document.createElement('a');json.href='/api/experiment/export/'+encodeURIComponent(session.session_id)+'.json';json.dataset.filename=session.session_id+'.json';json.textContent='JSON';bindExport(json);actions.append(participant,csv,json);row.append(info,actions);root.append(row)}}
async function init(){try{$('adminToken').value=sessionStorage.getItem('aria-experiment-admin-token')||'';$('adminToken').addEventListener('input',()=>sessionStorage.setItem('aria-experiment-admin-token',$('adminToken').value));const data=await api('/api/experiment/default-config');defaultConfig=structuredClone(data.config);let migrated=false;if(!data.config_initialized)migrated=mergeSavedBrowserSettings(defaultConfig);if(migrated)await api('/api/experiment/config',{config:defaultConfig});$('config').value=JSON.stringify(defaultConfig,null,2);$('sourceNote').textContent=migrated?'このブラウザの手動調整値をサーバーに保存しました。':'このサーバーに保存された設定です。別のPC・ブラウザからも同じ値を使います。';renderConfig();await refreshSessions()}catch(error){$('configStatus').textContent=error.message;$('configStatus').className='status error';$('createStatus').textContent='設定を読み込めませんでした。';$('createStatus').className='status error';$('connectionSettings').open=true}}
$('checkConfig').addEventListener('click',renderConfig);$('config').addEventListener('input',()=>{validatedConfig=null});
$('connectAdmin').addEventListener('click',()=>void init());
$('checkHardware').addEventListener('click',async()=>{const button=$('checkHardware');button.disabled=true;$('hardwareStatus').textContent='接続を確認しています…';try{const state=await api('/api/experiment/hardware/status');$('hardwareStatus').textContent=state.active?'別の画面が実機を操作中です。':'Piの制御サービスに接続できました。現在位置を読み取りました。';$('hardwareStatus').className='status'}catch(error){$('hardwareStatus').textContent=error.message;$('hardwareStatus').className='status error'}finally{button.disabled=false}});
$('hardwareMode').addEventListener('change',()=>{$('hardwareStatus').textContent='';$('hardwareStatus').className='status'});
$('createSession').addEventListener('click',async()=>{const button=$('createSession');button.disabled=true;$('createStatus').textContent='作成中…';try{const config=readConfig();const created=await api('/api/experiment/session/create',{participant_id:$('participantId').value.trim(),mode:$('mode').value,hardware_mode:$('hardwareMode').value,config});const session=created.session;const link=location.origin+session.participant_url;$('createStatus').textContent=session.hardware_mode==='hardware'?'作成しました。実機は参加者が同意して開始するまで動きません。':'作成しました。実機は動きません。';$('createdSession').innerHTML='';const box=document.createElement('div');box.className='alert';const title=document.createElement('strong');title.textContent=session.participant_id+' · '+(session.mode==='pilot'?'予備実験':'本実験')+' · '+(session.hardware_mode==='hardware'?'実機':'動作確認');const p=document.createElement('p');p.textContent='42条件 · '+new Set(session.trials.map(t=>t.physical_state_id)).size+' 種の物理状態';const a=document.createElement('a');a.href=link;a.textContent='回答画面を開く';const copy=document.createElement('button');copy.className='button secondary';copy.textContent='リンクをコピー';copy.addEventListener('click',async()=>{try{if(!navigator.clipboard?.writeText)throw new Error('unavailable');await navigator.clipboard.writeText(link);copy.textContent='コピーしました'}catch{window.prompt('このリンクをコピーしてください',link)}});const csv=document.createElement('a');csv.href='/api/experiment/export/'+encodeURIComponent(session.session_id)+'.csv';csv.dataset.filename=session.session_id+'.csv';csv.textContent='CSV';bindExport(csv);const json=document.createElement('a');json.href='/api/experiment/export/'+encodeURIComponent(session.session_id)+'.json';json.dataset.filename=session.session_id+'.json';json.textContent='JSON';bindExport(json);box.append(title,p,a,document.createTextNode(' · '),copy,document.createTextNode(' · '),csv,json);$('createdSession').append(box);await refreshSessions()}catch(error){$('createStatus').textContent=error.message;$('createStatus').className='status error'}finally{button.disabled=false}});
init();
</script>
</body>
</html>
