<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>被験者用ページ | ARIA</title>
<link rel="stylesheet" href="/experiment.css">
<style>
body.participant { background: #f5f7fa; }
.participant .header-inner, .participant main, .participant footer { max-width: 860px; }
.participant main { padding: 24px 18px 40px; }
.participant .screen { min-height: 0; padding: clamp(20px, 4vw, 36px); border: 1px solid var(--line); }
.participant .screen h1 { margin-top: 0; font-size: clamp(22px, 3vw, 28px); }
@media(max-width: 760px) { .participant main { padding: 16px 12px 30px; } }
</style>
</head>
<body class="participant">
<header><div class="header-inner"><div class="brand">被験者用ページ</div><span id="modeLabel" class="tag">動作確認用</span><div id="progress" class="progress"></div></div></header>
<main><section class="screen" id="screen" aria-live="polite"><p>セッションを読み込んでいます…</p></section></main>
<footer>参加は任意です。途中でやめることもできます。</footer>
<script>
const $=id=>document.getElementById(id);const query=new URLSearchParams(location.search);const sessionId=query.get('session')||'';const access=new URLSearchParams(location.hash.slice(1)).get('access')||'';let view=null;let busy=false;let abortPending=false;let responseStarted=0;let responseLatency=null;let selectedEmotion=null;let selectedConfidence=null;let hardwareHeartbeat=0;let hardwareHeartbeatPending=false;let hardwareHeartbeatError=null;let hardwareHeartbeatGeneration=0;
const answers=[['anger','怒っている'],['disgust','嫌がっている（嫌悪）'],['fear','怖がっている'],['joy','喜んでいる'],['sadness','悲しんでいる'],['surprise','驚いている'],['neutral','特に感情を感じない'],['other','その他・わからない']];
async function api(path,body={}){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,access,...body})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||`HTTP ${response.status}`);return result}
async function load(){if(!sessionId||!access){showError('参加者リンクが不足しています。管理者から受け取ったリンクを開いてください。');return}try{view=await api('/api/experiment/session/state');updateProgress();renderState()}catch(error){showError(error.message)}}
function updateProgress(){if(!view)return;const done=view.progress.completed;const max=view.progress.total;$('progress').textContent=done?`${Math.min(done+1,max)} / ${max}`:''}
function setScreen(html){$('screen').innerHTML=html;window.scrollTo({top:0,behavior:'auto'});const focusTarget=$('screen').querySelector('h1,h2,button,input');if(focusTarget){if(/^H[12]$/.test(focusTarget.tagName))focusTarget.tabIndex=-1;focusTarget.focus({preventScroll:true})}}
function showError(message,canRetry=true){setScreen(`<div class="eyebrow">接続を確認してください</div><h1>一時停止中</h1><div class="error" role="alert"></div><div class="actions"><button class="button secondary" id="reload">画面を再読み込み</button>${canRetry?'<button class="button" id="retry">続ける</button>':''}</div>`);$('screen').querySelector('.error').textContent=message;$('reload').onclick=()=>location.reload();if($('retry'))$('retry').onclick=()=>void load()}
function renderState(){$('modeLabel').textContent=view.hardware_mode==='hardware'?'実機提示':'動作確認用';if(view.status==='declined'){setScreen('<h1>参加を取りやめました</h1><p>この画面を閉じてください。</p>');return}if(view.status==='aborted'){setScreen('<h1>中断しました</h1><p>ここまでの回答は保存されています。</p>');return}if(view.status==='completed'){renderComplete();return}if(!view.consented){renderConsent();return}if(view.active){if(view.active.phase==='answer'){showAnswer(view.active.kind==='practice',view.active.response_elapsed_ms||0);return}renderRecovery(view.active);return}if(view.needs_break){renderBreak();return}if(view.status==='consented'){renderWelcome();return}if(!view.practice_done){renderNext('練習','操作と回答を1回練習します。練習の回答は集計しません。');return}if(view.progress.completed>=view.progress.total){renderComplete();return}renderNext(`${view.progress.completed+1} / ${view.progress.total}`,'準備ができたら開始してください。')}
function renderConsent(){const notice=view.hardware_mode==='hardware'?'実機の目の表情を見て、感じたことを回答してください。':'動作確認用です。実機は動きません。回答はテストデータとして保存されます。';setScreen(`<h1>実験の説明</h1><p>共通基準の瞼UI値：${view.baseline?.eyelid_open_percent ?? '不明'}%</p><p>ロボットの目がどの感情に見えるかを調べます。表情を見たあと、感情と回答への自信を選んでください。正解は表示しません。</p><p class="notice">${notice}</p><ul class="list"><li>記録するもの：参加者ID、回答、確信度、回答時間、提示条件</li><li>氏名・映像・音声は記録しません。</li><li>参加は自由です。途中でやめても不利益はありません。</li></ul><label class="checkbox"><input id="consentCheck" type="checkbox"><span>説明を読み、参加に同意します。</span></label><div class="actions"><button class="button" id="accept" disabled>同意して進む</button><button class="button secondary" id="decline">同意しない</button></div>`);const check=$('consentCheck');const accept=$('accept');check.addEventListener('change',()=>accept.disabled=!check.checked);accept.onclick=async()=>{if(busy||!check.checked)return;busy=true;accept.disabled=true;try{view=await api('/api/experiment/consent',{accepted:true});renderWelcome()}catch(error){showError(error.message)}finally{busy=false}};$('decline').onclick=async()=>{if(busy)return;busy=true;try{view=await api('/api/experiment/consent',{accepted:false});renderState()}catch(error){showError(error.message)}finally{busy=false}}}
function renderWelcome(){const notice=view.hardware_mode==='hardware'?'実機の目を見てください。':'動作確認用です。画面にも目を表示せず、実機も動きません。';setScreen(`<h1>開始前の確認</h1><p>練習1回のあと、42回の提示を行います。14回目と28回目のあとに休憩できます。回答に時間制限はありません。</p><p class="muted">${notice}</p><div class="actions"><button class="button" id="begin">開始する</button><button class="button secondary" id="withdraw">中断</button></div>`);$('begin').onclick=async()=>{if(busy)return;busy=true;try{view=await api('/api/experiment/start');renderNext('練習','操作と回答を1回練習します。練習の回答は集計しません。')}catch(error){showError(error.message)}finally{busy=false}};$('withdraw').onclick=()=>void abortSession()}
function renderNext(title,description){updateProgress();setScreen(`<p class="phase-label">開始待ち</p><h1>${title}</h1><p>${description}</p><div class="actions"><button class="button" id="next">開始する</button><button class="button secondary" id="withdraw">中断</button></div>`);$('next').onclick=()=>void runPresentation();$('withdraw').onclick=()=>void abortSession()}
function stopHardwareHeartbeat(){if(hardwareHeartbeat)clearInterval(hardwareHeartbeat);hardwareHeartbeat=0;hardwareHeartbeatGeneration++}
async function checkHardwareHeartbeat(){
  if(view?.hardware_mode!=='hardware')return;
  const generation=hardwareHeartbeatGeneration;
  try{
    const result=await api('/api/experiment/heartbeat');
    if(result.active!==true)throw new Error('実機の操作権が失われました。実験者にお知らせください。');
  }catch(error){if(generation===hardwareHeartbeatGeneration)hardwareHeartbeatError=error;throw error}
}
function startHardwareHeartbeat(){
  if(view?.hardware_mode!=='hardware'||hardwareHeartbeat)return;
  hardwareHeartbeat=setInterval(async()=>{
    if(hardwareHeartbeatPending)return;
    hardwareHeartbeatPending=true;
    const generation=hardwareHeartbeatGeneration;
    try{await checkHardwareHeartbeat()}catch{if(generation===hardwareHeartbeatGeneration)stopHardwareHeartbeat()}finally{hardwareHeartbeatPending=false}
  },500);
}
function delay(ms,onTick){
  return new Promise((resolve,reject)=>{
    const started=performance.now();
    function tick(){
      if(abortPending){reject(new Error('実験を中断しました。'));return}
      if(hardwareHeartbeatError){reject(new Error('実機との接続が途切れました。実験者にお知らせください。'));return}
      const remaining=Math.max(0,ms-(performance.now()-started));
      if(onTick)onTick(remaining);
      if(remaining===0){resolve();return}
      setTimeout(tick,Math.min(100,remaining));
    }
    tick();
  });
}
function showPresentationPhase(label,durationMs=null,remainingMs=durationMs){
  const phase=$('presentationPhase'),countdown=$('phaseCountdown'),bar=$('phaseProgress');
  if(!phase||!countdown||!bar)return;
  if(phase.textContent!==label)phase.textContent=label;
  bar.setAttribute('aria-label',label+'の残り時間');
  if(durationMs===null){
    countdown.textContent='処理中';bar.removeAttribute('value');
    bar.setAttribute('aria-valuetext','処理中');
    return;
  }
  const remaining=Math.max(0,Math.min(durationMs,remainingMs));
  const seconds=(Math.ceil(remaining/100)/10).toFixed(1);
  countdown.textContent='残り '+seconds+' 秒';
  bar.max=durationMs;bar.value=remaining;
  bar.setAttribute('aria-valuetext','残り '+seconds+' 秒');
}
async function waitPresentationPhase(label,ms){
  showPresentationPhase(label,ms,ms);
  await delay(ms,remaining=>showPresentationPhase(label,ms,remaining));
}
async function recordEvent(name){if(hardwareHeartbeatError)throw hardwareHeartbeatError;await api('/api/experiment/trial/event',{event:name})}
async function runPresentation(replay=false){
  if(busy||abortPending)return;
  busy=true;
  try{
    stopHardwareHeartbeat();hardwareHeartbeatError=null;
    const stimulus=await api('/api/experiment/trial/start',{replay,protocol_version:view.presentation_protocol?.version});
    const practice=stimulus.kind==='practice',hardware=view.hardware_mode==='hardware';
    setScreen(`<div class="eyebrow">${practice?'練習':`${stimulus.progress.completed+1} / ${stimulus.progress.total}`}</div>
      <div class="presentation">
        <h1>${hardware?'ロボットの目を見てください':'提示中'}</h1>
        <p id="presentationPhase" class="phase-label" role="status">準備しています</p>
        <div class="phase-timing" aria-live="off">
          <span id="phaseCountdown" class="phase-countdown">処理中</span>
          <progress id="phaseProgress" class="phase-progress" aria-label="提示の残り時間"></progress>
        </div>
      </div>
      <div class="actions"><button class="button secondary" id="withdraw">中断</button></div>`);
    $('withdraw').onclick=()=>void abortSession();
    showPresentationPhase('準備しています');
    await recordEvent('instruction');startHardwareHeartbeat();
    await waitPresentationPhase('開始までお待ちください',2000);
    showPresentationPhase('表情への移行を開始しています');
    await recordEvent('baseline');await recordEvent('transition');
    await waitPresentationPhase('表情へ移行中',500);
    showPresentationPhase('表情の保持を開始しています');
    await recordEvent('target');
    await waitPresentationPhase('表情を表示中',5000);
    showPresentationPhase('基準への復帰を開始しています');
    await recordEvent('return');
    await waitPresentationPhase('基準に戻しています',500);
    showPresentationPhase('回答画面を準備しています');
    await checkHardwareHeartbeat();await recordEvent('response');showAnswer(practice);
  }catch(error){
    stopHardwareHeartbeat();hardwareHeartbeatError=null;
    if(!abortPending){
      await api('/api/experiment/error',{message:error.message}).catch(()=>{});
      showError(`${error.message} 同じ提示枠から再開できます。`);
    }
  }finally{busy=false}
}
function showAnswer(practice,elapsedMs=0){selectedEmotion=null;selectedConfidence=null;responseLatency=null;setScreen(`<div class="eyebrow">${practice?'練習の回答':`${view.progress.completed+1} / ${view.progress.total}`}</div><p class="phase-label">回答中 · 時間制限なし</p><h2>今の目は、どの感情に見えましたか？</h2><div class="choices" role="group" aria-label="感情の回答">${answers.map(([id,label])=>`<button type="button" class="choice" data-emotion="${id}" aria-pressed="false">${label}</button>`).join('')}</div><div class="confidence hidden" id="confidence"><h3>回答にどのくらい自信がありますか？</h3><div class="confidence-list" role="group" aria-label="確信度">${[['1','ほとんど自信がない'],['2','あまり自信がない'],['3','やや自信がある'],['4','とても自信がある']].map(([value,label])=>`<button type="button" class="choice" data-confidence="${value}" aria-pressed="false">${value} · ${label}</button>`).join('')}</div></div><div class="actions"><button class="button" id="submitAnswer" disabled>回答を選択してください</button><button class="button secondary" id="withdraw">中断</button></div>`);responseStarted=performance.now()-Math.max(0,Number(elapsedMs)||0);$('withdraw').onclick=()=>void abortSession();document.querySelectorAll('[data-emotion]').forEach(button=>button.addEventListener('click',()=>{const nextEmotion=button.dataset.emotion;if(selectedEmotion===null)responseLatency=Math.max(0,Math.round(performance.now()-responseStarted));if(nextEmotion!==selectedEmotion)selectedConfidence=null;selectedEmotion=nextEmotion;document.querySelectorAll('[data-emotion]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));const confidence=$('confidence');if(selectedEmotion==='other'){confidence.classList.add('hidden');selectedConfidence=null;$('submitAnswer').disabled=false;$('submitAnswer').textContent='回答を確定'}else{confidence.classList.remove('hidden');$('submitAnswer').disabled=true;$('submitAnswer').textContent='確信度を選択してください'}}));document.querySelectorAll('[data-confidence]').forEach(button=>button.addEventListener('click',()=>{selectedConfidence=Number(button.dataset.confidence);document.querySelectorAll('[data-confidence]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));$('submitAnswer').disabled=false;$('submitAnswer').textContent='回答を確定'}));$('submitAnswer').onclick=()=>void submitAnswer(practice)}
async function submitAnswer(practice){if(busy||selectedEmotion===null||(selectedEmotion!=='other'&&selectedConfidence===null))return;busy=true;$('submitAnswer').disabled=true;try{view=await api('/api/experiment/answer',{perceived_emotion:selectedEmotion,confidence:selectedEmotion==='other'?null:selectedConfidence,response_latency_ms:responseLatency});if(view.status==='completed'){stopHardwareHeartbeat();renderComplete();return}if(view.needs_break){stopHardwareHeartbeat();renderBreak();return}if(practice){renderNext(`1 / ${view.progress.total}`,'練習終了です。本番を始めます。')}else{renderNext(`${view.progress.completed+1} / ${view.progress.total}`,'準備ができたら開始してください。')}}catch(error){showError(error.message)}finally{busy=false}}
function renderRecovery(active){setScreen(`<h1>提示をやり直しますか？</h1><p>表示が中断されたため、同じ条件をもう一度提示します。再提示したことは記録されます。</p><div class="actions"><button class="button" id="resume">もう一度提示する</button><button class="button secondary" id="withdraw">中断</button></div>`);$('resume').onclick=()=>void runPresentation(true);$('withdraw').onclick=()=>void abortSession()}
function renderBreak(){setScreen(`<h1>休憩</h1><p>${view.progress.completed} / ${view.progress.total} 回が終わりました。準備ができたら再開してください。</p><div class="actions"><button class="button" id="resumeBreak">再開する</button><button class="button secondary" id="withdraw">中断</button></div>`);$('resumeBreak').onclick=async()=>{if(busy)return;busy=true;try{view=await api('/api/experiment/break');renderNext(`${view.progress.completed+1} / ${view.progress.total}`,'休憩を記録しました。準備ができたら次へ進んでください。')}catch(error){showError(error.message)}finally{busy=false}};$('withdraw').onclick=()=>void abortSession()}
function renderComplete(){updateProgress();setScreen(`<h1>終了しました</h1><p>回答を保存しました。ご協力ありがとうございました。</p><label class="muted" for="freeText">コメント（任意）</label><textarea id="freeText" class="textarea" maxlength="2000" placeholder="気になった点があれば入力してください"></textarea><div class="actions"><button class="button" id="finish">終了する</button></div><div id="finishStatus" class="status" role="status"></div>`);$('finish').onclick=async()=>{if(busy)return;busy=true;try{await api('/api/experiment/feedback',{free_text:$('freeText').value});$('finishStatus').textContent='保存しました。この画面を閉じてください。';$('finish').disabled=true}catch(error){$('finishStatus').textContent=error.message}finally{busy=false}}}
async function abortSession(){if(abortPending||!confirm('実験を中断しますか？ ここまでの記録は保存されます。'))return;abortPending=true;stopHardwareHeartbeat();try{view=await api('/api/experiment/abort');renderState()}catch(error){abortPending=false;showError(error.message)}}
window.addEventListener('pagehide',()=>{stopHardwareHeartbeat();if(view?.hardware_mode==='hardware')fetch('/api/experiment/hardware/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,access}),keepalive:true}).catch(()=>{})});
load();
</script>
</body>
</html>
