<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Aria · 表情の見え方</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#20221e;background:#f4f4f0;--line:#dedfd8;--muted:#666a62;--green:#394737;--iris:#bfbfbf;--gx:0;--gy:0;--open:1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}header{height:60px;flex:none;padding:0 max(18px,calc((100vw - 760px)/2));display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:700}.progress{font-size:13px;color:var(--muted)}main{width:min(760px,100%);margin:0 auto;padding:24px 20px 50px;flex:1;display:flex;flex-direction:column;justify-content:center}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(20px,5vw,38px);box-shadow:0 5px 20px #2221}.eyebrow{font-size:11px;letter-spacing:.13em;color:#73776d;font-weight:700}h1{font-size:clamp(25px,5vw,34px);line-height:1.25;margin:9px 0 14px}h2{font-size:clamp(20px,4vw,27px);line-height:1.5;margin:4px 0 20px}p{font-size:15px;line-height:1.75;color:#4e514a}.muted{font-size:13px;color:var(--muted);line-height:1.7}.button{min-height:52px;padding:0 21px;border:0;border-radius:10px;background:var(--green);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}.button.secondary{background:#f1f2ed;border:1px solid var(--line);color:#272a24}.button.danger{background:#8f3835}.button:disabled{opacity:.48;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.checkbox{display:flex;gap:11px;align-items:flex-start;margin:20px 0;padding:15px;border-radius:10px;background:#f5f6f2;font-size:14px;line-height:1.65}.checkbox input{width:21px;height:21px;flex:none;margin:0;accent-color:var(--green)}.list{padding-left:20px;line-height:1.8;font-size:14px}.eye-stage{height:min(43vh,340px);min-height:230px;margin:5px 0 20px;border-radius:14px;background:radial-gradient(ellipse,#e7e6df 0,#dbdad3 70%,#d2d1ca);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.eye-pair{display:flex;gap:clamp(18px,7vw,58px);align-items:center}.eye{width:clamp(104px,23vw,174px);height:clamp(65px,14vw,108px);position:relative;border-radius:50% / 55%;background:linear-gradient(#fffefb,#edeae1);box-shadow:inset 0 -4px 11px #2b2b241c,0 5px 12px #2222;transform:scaleY(clamp(.08,var(--open),1));transition:transform .5s cubic-bezier(.2,.7,.2,1)}.iris{position:absolute;width:42%;height:72%;top:50%;left:50%;border-radius:50%;background:radial-gradient(circle at 50% 50%,#121511 0 22%,color-mix(in srgb,var(--iris) 84%,#20241c 16%) 24% 67%,color-mix(in srgb,var(--iris) 55%,#161913 45%) 70% 84%,#272a24 86%);box-shadow:0 0 0 2px #16191348;transform:translate(calc(-50% + var(--gx)*24px),calc(-50% - var(--gy)*15px));transition:transform .5s cubic-bezier(.2,.7,.2,1),background .12s ease}.pupil{position:absolute;width:39%;height:48%;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;background:#11140f}.glint{position:absolute;top:17%;left:23%;width:12%;aspect-ratio:1;border-radius:50%;background:#fffef1}.instruction{position:absolute;inset:0;display:grid;place-items:center;background:#f4f4f0e8;font-size:clamp(21px,5vw,30px);font-weight:650;text-align:center}.phase-label{text-align:center;color:#696d64;font-size:13px;min-height:21px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{min-height:58px;padding:10px 13px;border-radius:10px;border:1px solid #d6d8d0;background:#fff;color:#252821;font:inherit;font-size:16px;text-align:left;cursor:pointer}.choice:hover{border-color:#77856b;background:#fafbf8}.choice[aria-pressed=true]{border:2px solid #40523a;background:#f0f3ed}.confidence{margin-top:22px}.confidence h3{font-size:16px;margin:0 0 10px}.confidence-list{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.confidence .choice{text-align:center;font-size:14px;padding:9px 6px}.progressbar{height:7px;background:#e5e6e0;border-radius:99px;overflow:hidden;margin:8px 0 20px}.progressbar span{display:block;height:100%;width:0;background:#718164;transition:width .2s}.error{padding:12px;background:#fff0ed;color:#8e2925;border:1px solid #edc8c3;border-radius:9px;font-size:14px;line-height:1.5;margin:10px 0}.textarea{width:100%;min-height:100px;border:1px solid #d4d6ce;border-radius:9px;padding:12px;font:inherit;resize:vertical}.hidden{display:none!important}.trial-note{text-align:center;color:#686b63;font-size:13px;margin:6px 0 0}footer{text-align:center;padding:12px 16px 19px;color:#7a7d75;font-size:11px}@media(max-width:520px){header{padding:0 15px}main{padding:14px 12px 30px}.card{padding:21px 16px}.choices{grid-template-columns:1fr}.confidence-list{grid-template-columns:1fr 1fr}.eye-stage{min-height:215px}.actions .button{flex:1}}
.eye{transition:none}.eye-stage.animated .eye{transition:transform .5s cubic-bezier(.2,.7,.2,1)}.eye-stage.animated .iris{transition:transform .5s cubic-bezier(.2,.7,.2,1),background .5s ease}
</style>
</head>
<body>
<header><div class="brand">ARIA <span class="muted">表情の見え方</span></div><div id="progress" class="progress"></div></header>
<main><section class="card" id="screen" aria-live="polite"><p>セッションを読み込んでいます…</p></section></main>
<footer>参加は任意です。いつでも中断できます。</footer>
<script>
const $=id=>document.getElementById(id);const query=new URLSearchParams(location.search);const sessionId=query.get('session')||'';const access=new URLSearchParams(location.hash.slice(1)).get('access')||'';let view=null;let busy=false;let abortPending=false;let activeVisual=null;let responseStarted=0;let responseLatency=null;let selectedEmotion=null;let selectedConfidence=null;
const answers=[['anger','怒っている'],['disgust','嫌がっている（嫌悪）'],['fear','怖がっている'],['joy','喜んでいる'],['sadness','悲しんでいる'],['surprise','驚いている'],['neutral','特に感情を感じない'],['other','その他・わからない']];
async function api(path,body={}){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,access,...body})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||`HTTP ${response.status}`);return result}
async function load(){if(!sessionId||!access){showError('参加者リンクが不足しています。管理者から受け取ったリンクを開いてください。');return}try{view=await api('/api/experiment/session/state');updateProgress();renderState()}catch(error){showError(error.message)}}
function updateProgress(){if(!view)return;const done=view.progress.completed;const max=view.progress.total;$('progress').textContent=done?`Trial ${Math.min(done+1,max)} / ${max}`:''}
function setScreen(html){$('screen').innerHTML=html;window.scrollTo({top:0,behavior:'auto'});const focusTarget=$('screen').querySelector('h1,h2,button,input');if(focusTarget){if(/^H[12]$/.test(focusTarget.tagName))focusTarget.tabIndex=-1;focusTarget.focus({preventScroll:true})}}
function showError(message,canRetry=true){setScreen(`<div class="eyebrow">接続を確認してください</div><h1>一時停止中</h1><div class="error" role="alert"></div><div class="actions"><button class="button secondary" id="reload">画面を再読み込み</button>${canRetry?'<button class="button" id="retry">続ける</button>':''}</div>`);$('screen').querySelector('.error').textContent=message;$('reload').onclick=()=>location.reload();if($('retry'))$('retry').onclick=()=>void load()}
function renderState(){if(view.status==='declined'){setScreen('<h1>同意は記録されませんでした</h1><p>参加しない選択を記録しました。この画面を閉じてください。</p>');return}if(view.status==='aborted'){setScreen('<h1>セッションを中断しました</h1><p>ここまでの状態は保存されています。実験者にお知らせください。</p>');return}if(view.status==='completed'){renderComplete();return}if(!view.consented){renderConsent();return}if(view.active){renderRecovery(view.active);return}if(view.needs_break){renderBreak();return}if(view.status==='consented'){renderWelcome();return}if(!view.practice_done){renderNext('練習','まず1回、操作と回答の流れを練習します。練習の回答は本試行データに含まれません。');return}if(view.progress.completed>=view.progress.total){renderComplete();return}renderNext(`Trial ${view.progress.completed+1} / ${view.progress.total}`,'準備ができたら次へ進んでください。途中で休みたい場合は実験者にお知らせください。')}
function renderConsent(){setScreen(`<div class="eyebrow">研究への参加について</div><h1>目の表情を見て、感じたことを答えてください</h1><p>ロボットの目の表情がどのような気持ちに見えるかを調べます。提示のあと、見えた感情と回答への自信を選びます。正解・不正解のフィードバックはありません。</p><ul class="list"><li>記録するのは参加者ID、回答、確信度、回答時間、提示条件です。</li><li>氏名、映像、音声は記録しません。</li><li>参加は任意で、いつでも中断できます。中断しても不利益はありません。</li></ul><label class="checkbox"><input id="consentCheck" type="checkbox"><span>説明を読み、参加に同意します。</span></label><div class="actions"><button class="button" id="accept" disabled>同意して進む</button><button class="button secondary" id="decline">同意しない</button></div>`);const check=$('consentCheck');const accept=$('accept');check.addEventListener('change',()=>accept.disabled=!check.checked);accept.onclick=async()=>{if(busy||!check.checked)return;busy=true;accept.disabled=true;try{view=await api('/api/experiment/consent',{accepted:true});renderWelcome()}catch(error){showError(error.message)}finally{busy=false}};$('decline').onclick=async()=>{if(busy)return;busy=true;try{view=await api('/api/experiment/consent',{accepted:false});renderState()}catch(error){showError(error.message)}finally{busy=false}}}
function renderWelcome(){setScreen(`<div class="eyebrow">開始前の案内</div><h1>ロボットの目を見てください</h1><p>目から約80cmの位置を目安に、無理のない姿勢でご覧ください。1回の練習のあと、42回の提示があります。14回ごとに休憩画面が入ります。回答に時間制限はありません。</p><p class="muted">提示中に目が動いたあと、基準の目に戻ってから回答画面が表示されます。画面を再読み込みしても、進行状況は保存されています。</p><div class="actions"><button class="button" id="begin">説明を確認して開始</button><button class="button secondary" id="withdraw">中断</button></div>`);$('begin').onclick=async()=>{if(busy)return;busy=true;try{view=await api('/api/experiment/start');renderNext('練習','まず1回、操作と回答の流れを練習します。練習の回答は本試行データに含まれません。')}catch(error){showError(error.message)}finally{busy=false}};$('withdraw').onclick=()=>void abortSession()}
function renderNext(title,description){updateProgress();setScreen(`<div class="eyebrow">${title}</div><h1>準備ができたら「次へ」を押してください</h1><p>${description}</p><div class="actions"><button class="button" id="next">次へ</button><button class="button secondary" id="withdraw">中断</button></div>`);$('next').onclick=()=>void runPresentation();$('withdraw').onclick=()=>void abortSession()}
function eyeMarkup(){return `<div class="eye-pair" aria-hidden="true"><div class="eye"><div class="iris"><div class="pupil"></div><div class="glint"></div></div></div><div class="eye"><div class="iris"><div class="pupil"></div><div class="glint"></div></div></div></div>`}
function visualOpen(values){return Math.max(.06,1-Number(values.eyelid_open_percent)/100)}
function applyVisual(values,animate=false){const stage=document.documentElement;const eye=$('eyeStage');if(eye)eye.classList.toggle('animated',animate);stage.style.setProperty('--iris',values.iris_hex);stage.style.setProperty('--open',visualOpen(values));stage.style.setProperty('--gx',Math.max(-1,Math.min(1,Number(values.gaze_horizontal_deg)/20)));stage.style.setProperty('--gy',Math.max(-1,Math.min(1,Number(values.gaze_vertical_deg)/20)))}
function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function recordEvent(name){await api('/api/experiment/trial/event',{event:name})}
async function runPresentation(replay=false){if(busy||abortPending)return;busy=true;try{const stimulus=await api('/api/experiment/trial/start',{replay});activeVisual=stimulus;const practice=stimulus.kind==='practice';setScreen(`<div class="eyebrow">${practice?'練習':`Trial ${stimulus.progress.completed+1} / ${stimulus.progress.total}`}</div><div class="eye-stage hidden" id="eyeStage">${eyeMarkup()}<div class="instruction hidden" id="instruction">ロボットの目を見てください</div></div><div class="phase-label" id="phaseLabel">準備中</div><button class="button secondary" id="withdraw">中断</button>`);applyVisual(stimulus.baseline,false);$('withdraw').onclick=()=>void abortSession();const stage=$('eyeStage');await recordEvent('instruction');if(abortPending)return;stage.classList.remove('hidden');$('instruction').classList.remove('hidden');$('phaseLabel').textContent='ロボットの目を見てください';await delay(1000);if(abortPending)return;$('instruction').classList.add('hidden');await recordEvent('baseline');if(abortPending)return;applyVisual(stimulus.baseline,false);$('phaseLabel').textContent='';await delay(500);if(abortPending)return;await recordEvent('transition');if(abortPending)return;applyVisual(stimulus.visual,true);await delay(500);if(abortPending)return;await recordEvent('target');if(abortPending)return;await delay(3000);if(abortPending)return;await recordEvent('return');if(abortPending)return;applyVisual(stimulus.baseline,true);await delay(500);if(abortPending)return;await recordEvent('response');if(abortPending)return;showAnswer(practice)}catch(error){if(!abortPending){await api('/api/experiment/error',{message:error.message}).catch(()=>{});showError(`${error.message} 同じ提示枠から再開できます。`)}}finally{busy=false}}
function showAnswer(practice){selectedEmotion=null;selectedConfidence=null;responseLatency=null;setScreen(`<div class="eyebrow">${practice?'練習の回答':`Trial ${view.progress.completed+1} / ${view.progress.total}`}</div><h2>今提示された目の表情について、ロボット自身がどのような気持ちに見えましたか？</h2><div class="choices" role="group" aria-label="感情の回答">${answers.map(([id,label])=>`<button type="button" class="choice" data-emotion="${id}" aria-pressed="false">${label}</button>`).join('')}</div><div class="confidence hidden" id="confidence"><h3>その回答に、どのくらい自信がありますか？</h3><div class="confidence-list" role="group" aria-label="確信度">${[['1','ほとんど自信がない'],['2','あまり自信がない'],['3','やや自信がある'],['4','とても自信がある']].map(([value,label])=>`<button type="button" class="choice" data-confidence="${value}" aria-pressed="false">${value} · ${label}</button>`).join('')}</div></div><div class="actions"><button class="button" id="submitAnswer" disabled>回答を選択してください</button><button class="button secondary" id="withdraw">中断</button></div>`);responseStarted=performance.now();$('withdraw').onclick=()=>void abortSession();document.querySelectorAll('[data-emotion]').forEach(button=>button.addEventListener('click',()=>{selectedEmotion=button.dataset.emotion;responseLatency=Math.max(0,Math.round(performance.now()-responseStarted));document.querySelectorAll('[data-emotion]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));const confidence=$('confidence');if(selectedEmotion==='other'){confidence.classList.add('hidden');selectedConfidence=null;$('submitAnswer').disabled=false;$('submitAnswer').textContent='回答を確定'}else{confidence.classList.remove('hidden');$('submitAnswer').disabled=true;$('submitAnswer').textContent='確信度を選択してください'}}));document.querySelectorAll('[data-confidence]').forEach(button=>button.addEventListener('click',()=>{selectedConfidence=Number(button.dataset.confidence);document.querySelectorAll('[data-confidence]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));$('submitAnswer').disabled=false;$('submitAnswer').textContent='回答を確定'}));$('submitAnswer').onclick=()=>void submitAnswer(practice)}
async function submitAnswer(practice){if(busy||selectedEmotion===null||(selectedEmotion!=='other'&&selectedConfidence===null))return;busy=true;$('submitAnswer').disabled=true;try{view=await api('/api/experiment/answer',{perceived_emotion:selectedEmotion,confidence:selectedEmotion==='other'?null:selectedConfidence,response_latency_ms:responseLatency});if(view.status==='completed'){renderComplete();return}if(view.needs_break){renderBreak();return}if(practice){renderNext(`Trial 1 / ${view.progress.total}`,'練習はここまでです。続けて本試行を行います。練習の回答は本試行データに含まれません。')}else{renderNext(`Trial ${view.progress.completed+1} / ${view.progress.total}`,'回答を保存しました。準備ができたら次へ進んでください。')}}catch(error){showError(error.message)}finally{busy=false}}
function renderRecovery(active){setScreen(`<div class="eyebrow">進行状況を保存しました</div><h1>提示を再開しますか？</h1><p>画面を開き直したため、現在の提示は最初からやり直します。前の試行は再提示として記録されます。</p><p class="muted">再提示時も同じ条件を使い、回答は最後に完了したものを記録します。</p><div class="actions"><button class="button" id="resume">同じ提示を最初から見る</button><button class="button secondary" id="withdraw">中断</button></div>`);$('resume').onclick=()=>void runPresentation(true);$('withdraw').onclick=()=>void abortSession()}
function renderBreak(){setScreen(`<div class="eyebrow">休憩</div><h1>ここで少し休憩してください</h1><p>ここまで ${view.progress.completed} / ${view.progress.total} 回の回答を保存しました。準備ができたら再開してください。</p><div class="actions"><button class="button" id="resumeBreak">実験を再開</button><button class="button secondary" id="withdraw">中断</button></div>`);$('resumeBreak').onclick=async()=>{if(busy)return;busy=true;try{view=await api('/api/experiment/break');renderNext(`Trial ${view.progress.completed+1} / ${view.progress.total}`,'休憩を記録しました。準備ができたら次へ進んでください。')}catch(error){showError(error.message)}finally{busy=false}};$('withdraw').onclick=()=>void abortSession()}
function renderComplete(){updateProgress();setScreen(`<div class="eyebrow">完了</div><h1>ご協力ありがとうございました</h1><p>すべての回答を保存しました。</p><label class="muted" for="freeText">任意のコメント</label><textarea id="freeText" class="textarea" maxlength="2000" placeholder="気づいたことがあれば入力してください"></textarea><div class="actions"><button class="button" id="finish">コメントを保存して終了</button></div><div id="finishStatus" class="status" role="status"></div>`);$('finish').onclick=async()=>{if(busy)return;busy=true;try{await api('/api/experiment/feedback',{free_text:$('freeText').value});$('finishStatus').textContent='保存しました。この画面を閉じてください。';$('finish').disabled=true}catch(error){$('finishStatus').textContent=error.message}finally{busy=false}}}
async function abortSession(){if(abortPending||!confirm('実験を中断しますか？ ここまでの記録は保存されます。'))return;abortPending=true;try{view=await api('/api/experiment/abort');renderState()}catch(error){abortPending=false;showError(error.message)}}
load();
</script>
</body>
</html>
