<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>被験者用ページ | ARIA</title>
<link rel="stylesheet" href="/experiment.css">
<style>
body.participant { background: #f5f7fa; }
.participant .header-inner, .participant main, .participant footer { max-width: 860px; }
.participant main { padding: 24px 18px 40px; }
.participant .screen { min-height: 0; padding: clamp(20px, 4vw, 36px); border: 1px solid var(--line); }
.participant .screen h1 { margin-top: 0; font-size: clamp(22px, 3vw, 28px); }
.trial-phase { border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.trial-phase .phase-label { margin: 0 0 6px; }
.trial-phase .phase-timing { min-height: 42px; margin-bottom: 10px; }
.trial-phase .phase-timing[hidden] { display: block; visibility: hidden; }
#trialScreen h1 { font-size: clamp(19px, 2.6vw, 24px); }
#trialScreen .choice:disabled { cursor: default; color: var(--muted); background: #f5f7fa; }
#trialScreen .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#trialScreen .confidence-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#withdrawTrial { margin-left: auto; }
#trialNotice { margin: 8px 0 0; }
@media (min-width: 760px) {
  #trialScreen .confidence-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media(max-width: 760px) { .participant main { padding: 16px 12px 30px; } }
</style>
</head>
<body class="participant">
<header><div class="header-inner"><div class="brand">被験者用ページ</div><span id="modeLabel" class="tag">動作確認用</span><div id="progress" class="progress"></div></div></header>
<main>
  <section class="screen" id="screen" aria-live="polite"><p>セッションを読み込んでいます…</p></section>
  <section class="screen" id="trialScreen" aria-labelledby="trialQuestion" hidden>
    <div class="trial-phase">
      <p id="presentationPhase" class="phase-label" role="status">準備しています</p>
      <div class="phase-timing" id="phaseTiming" aria-live="off">
        <span id="phaseCountdown" class="phase-countdown">処理中</span>
        <progress id="phaseProgress" class="phase-progress" aria-label="提示の残り時間"></progress>
      </div>
    </div>
    <h1 id="trialQuestion" tabindex="-1">今の目は、どの感情に見えましたか？</h1>
    <div id="emotionChoices" class="choices" role="group" aria-label="感情の回答"></div>
    <div id="confidence" class="confidence">
      <h3>回答にどのくらい自信がありますか？</h3>
      <div id="confidenceChoices" class="confidence-list" role="group" aria-label="確信度"></div>
    </div>
    <div class="actions">
      <button type="button" class="button" id="trialAction" hidden></button>
      <button type="button" class="button" id="submitAnswer" disabled>回答を確定</button>
      <button type="button" class="button secondary" id="withdrawTrial">中断</button>
    </div>
    <p id="trialNotice" class="status" role="status"></p>
  </section>
</main>
<footer>参加は任意です。途中でやめることもできます。</footer>
<script>
const $ = id => document.getElementById(id);
const sessionId = new URLSearchParams(location.search).get('session') || '';
const access = new URLSearchParams(location.hash.slice(1)).get('access') || '';
let view = null;
let busy = false;
let abortPending = false;
let answerPresentationId = null;
let responseStarted = 0;
let responseLatency = null;
let selectedEmotion = null;
let selectedConfidence = null;
let hardwareHeartbeat = 0;
let hardwareHeartbeatPending = false;
let hardwareHeartbeatError = null;
let hardwareHeartbeatGeneration = 0;
let cueAudio = null;
let trialControlsReady = false;
const answers=[['anger','怒っている'],['disgust','嫌がっている（嫌悪）'],['fear','怖がっている'],['joy','喜んでいる'],['sadness','悲しんでいる'],['surprise','驚いている'],['neutral','特に感情を感じない'],['other','その他・わからない']];
async function api(path,body={}){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,access,...body})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||`HTTP ${response.status}`);return result}
async function load(){
  if(!sessionId || !access){
    showError('参加者リンクが不足しています。管理者から受け取ったリンクを開いてください。');
    return;
  }
  try {
    view = await api('/api/experiment/session/state');
    abortPending = false;
    renderState();
  } catch(error) {
    showError(error.message);
  }
}
function updateProgress(){
  if(!view)return;
  const {completed,total} = view.progress;
  $('progress').textContent = view.status === 'completed' || view.needs_break
    ? `${completed} / ${total}`
    : view.practice_done ? `${Math.min(completed+1,total)} / ${total}` : '';
}
function setScreen(html){
  $('trialScreen').hidden = true;
  $('screen').hidden = false;
  $('screen').innerHTML = html;
  window.scrollTo({top:0,behavior:'auto'});
  const target = $('screen').querySelector('h1,h2,button,input');
  if(target){
    if(/^H[12]$/.test(target.tagName))target.tabIndex = -1;
    target.focus({preventScroll:true});
  }
}
function showError(message,canRetry=true){
  setScreen(`<h1>一時停止中</h1><div class="error" role="alert"></div><div class="actions"><button class="button secondary" id="reload">画面を再読み込み</button>${canRetry?'<button class="button" id="retry">状態を確認する</button>':''}</div>`);
  $('screen').querySelector('.error').textContent = message;
  $('reload').onclick = () => location.reload();
  if($('retry'))$('retry').onclick = () => void load();
}
function renderState(){
  updateProgress();
  $('modeLabel').textContent = view.hardware_mode === 'hardware' ? '実機提示' : '動作確認用';
  if(view.status === 'declined'){setScreen('<h1>参加を取りやめました</h1><p>この画面を閉じてください。</p>');return}
  if(view.status === 'aborted'){setScreen('<h1>中断しました</h1><p>ここまでの回答は保存されています。</p>');return}
  if(view.status === 'completed'){renderComplete();return}
  if(!view.consented){renderConsent();return}
  if(view.active){
    if(view.active.phase === 'answer' && view.active.presentation_id){
      showAnswer(view.active.kind === 'practice', view.active.response_elapsed_ms || 0, view.active.presentation_id);
    }else{
      offerTrialAction('提示をやり直しますか？','再提示は記録されます。','もう一度提示する', {replay:true});
    }
    return;
  }
  if(view.needs_break){renderBreak();return}
  if(view.status === 'consented'){renderWelcome();return}
  offerTrialAction('準備ができたら開始してください。','','続ける');
}
function renderConsent(){const notice=view.hardware_mode==='hardware'?'実機の目の表情を見て、感じたことを回答してください。':'動作確認用です。実機は動きません。回答はテストデータとして保存されます。';setScreen(`<h1>実験の説明</h1><p>共通基準の瞼UI値：${view.baseline?.eyelid_open_percent ?? '不明'}%</p><p>ロボットの目がどの感情に見えるかを調べます。表情を見たあと、感情と回答への自信を選んでください。正解は表示しません。</p><p class="notice">${notice}</p><ul class="list"><li>記録するもの：参加者ID、回答、確信度、回答時間、提示条件</li><li>氏名・映像・音声は記録しません。</li><li>参加は自由です。途中でやめても不利益はありません。</li></ul><label class="checkbox"><input id="consentCheck" type="checkbox"><span>説明を読み、参加に同意します。</span></label><div class="actions"><button class="button" id="accept" disabled>同意して進む</button><button class="button secondary" id="decline">同意しない</button></div>`);const check=$('consentCheck');const accept=$('accept');check.addEventListener('change',()=>accept.disabled=!check.checked);accept.onclick=async()=>{if(busy||!check.checked)return;busy=true;accept.disabled=true;try{view=await api('/api/experiment/consent',{accepted:true});renderWelcome()}catch(error){showError(error.message)}finally{busy=false}};$('decline').onclick=async()=>{if(busy)return;busy=true;try{view=await api('/api/experiment/consent',{accepted:false});renderState()}catch(error){showError(error.message)}finally{busy=false}}}
function renderWelcome(){
  const notice = view.hardware_mode === 'hardware'
    ? '開始音が鳴ったらロボットの目を見て、回答音が鳴ったら画面で回答してください。'
    : '動作確認用です。通知音と画面を確認できます。';
  setScreen(`<h1>開始前の確認</h1>
    <p>${notice}</p>
    <p>練習1回のあと、42回の提示を行います。14回目と28回目のあとに休憩できます。回答に時間制限はありません。</p>
    <div class="actions">
      <button class="button secondary" id="testSound">2種類の音を試聴する</button>
      <button class="button" id="begin">練習を始める</button>
      <button class="button secondary" id="withdraw">中断</button>
    </div>
    <p id="soundStatus" class="status" role="status"></p>`);
  $('testSound').onclick = () => void previewCues();
  $('begin').onclick = () => void startFromButton({startSession:true});
  $('withdraw').onclick = () => void abortSession();
}
async function enableCues(){
  if(!cueAudio){
    const Audio = window.AudioContext || window.webkitAudioContext;
    if(!Audio)throw new Error('音声を再生できるブラウザで開いてください。');
    cueAudio = new Audio();
  }
  if(cueAudio.state !== 'running'){
    let timeout;
    try {
      await Promise.race([
        cueAudio.resume(),
        new Promise((_,reject) => {
          timeout = setTimeout(() => reject(new Error('音声の再生を許可してから、もう一度押してください。')), 2000);
        })
      ]);
    } finally {
      clearTimeout(timeout);
    }
  }
  if(cueAudio.state !== 'running')throw new Error('音声を有効にしてから、もう一度押してください。');
}
function playCue(type,offset=0){
  if(cueAudio?.state !== 'running')throw new Error('通知音を再生できませんでした。');
  const frequencies = type === 'start' ? [440,660] : [660,440];
  const start = cueAudio.currentTime + offset;
  for(const [index,frequency] of frequencies.entries()){
    const at = start + index * .11;
    const note = cueAudio.createOscillator();
    const gain = cueAudio.createGain();
    note.frequency.value = frequency;
    gain.gain.setValueAtTime(0,at);
    gain.gain.linearRampToValueAtTime(.12,at+.01);
    gain.gain.linearRampToValueAtTime(0,at+.09);
    note.connect(gain);
    gain.connect(cueAudio.destination);
    note.onended = () => {note.disconnect();gain.disconnect()};
    note.start(at);
    note.stop(at+.09);
  }
}
async function previewCues(){
  if(busy || abortPending)return;
  busy = true;
  const status = $('soundStatus');
  try {
    await enableCues();
    if(abortPending)return;
    playCue('start');
    playCue('answer',.65);
    status.textContent = '低→高が開始音、高→低が回答音です。';
    await new Promise(resolve => setTimeout(resolve, 900));
  }catch(error){
    if(!abortPending)status.textContent = error.message;
  }finally{
    busy = false;
  }
}
function showTrialScreen(){
  if(!trialControlsReady){
    $('emotionChoices').innerHTML = answers.map(([id,label]) =>
      `<button type="button" class="choice" data-emotion="${id}" aria-pressed="false" disabled>${label}</button>`).join('');
    const confidenceLabels = ['ほとんど自信がない','あまり自信がない','やや自信がある','とても自信がある'];
    $('confidenceChoices').innerHTML = confidenceLabels.map((label,i) =>
      `<button type="button" class="choice" data-confidence="${i+1}" aria-pressed="false" disabled>${i+1} · ${label}</button>`).join('');
    for(const button of document.querySelectorAll('[data-emotion]')){
      button.onclick = () => {
        if(busy || !answerPresentationId || button.disabled)return;
        if(selectedEmotion === null)responseLatency = Math.max(0,Math.round(performance.now()-responseStarted));
        if(selectedEmotion !== button.dataset.emotion)selectedConfidence = null;
        selectedEmotion = button.dataset.emotion;
        setAnswerControls(true);
      };
    }
    for(const button of document.querySelectorAll('[data-confidence]')){
      button.onclick = () => {
        if(busy || button.disabled)return;
        selectedConfidence = Number(button.dataset.confidence);
        setAnswerControls(true);
      };
    }
    $('submitAnswer').onclick = () => void submitAnswer();
    $('withdrawTrial').onclick = () => void abortSession();
    trialControlsReady = true;
  }
  const entering = $('trialScreen').hidden;
  $('screen').hidden = true;
  $('trialScreen').hidden = false;
  updateProgress();
  if(entering)window.scrollTo({top:0,behavior:'auto'});
}
function setAnswerControls(enabled){
  const needsConfidence = selectedEmotion !== null && selectedEmotion !== 'other';
  for(const button of document.querySelectorAll('[data-emotion]')){
    button.disabled = !enabled;
    button.setAttribute('aria-pressed',String(button.dataset.emotion === selectedEmotion));
  }
  for(const button of document.querySelectorAll('[data-confidence]')){
    button.disabled = !enabled || !needsConfidence;
    button.setAttribute('aria-pressed',String(Number(button.dataset.confidence) === selectedConfidence));
  }
  $('submitAnswer').disabled = !enabled || selectedEmotion === null || (needsConfidence && selectedConfidence === null);
}
function clearAnswer(){
  answerPresentationId = null;
  responseLatency = null;
  selectedEmotion = null;
  selectedConfidence = null;
  setAnswerControls(false);
}
function offerTrialAction(label,notice,buttonText,options={}){
  showTrialScreen();
  clearAnswer();
  $('phaseTiming').hidden = true;
  $('presentationPhase').textContent = label;
  $('trialNotice').textContent = notice;
  const action = $('trialAction');
  action.textContent = buttonText;
  action.hidden = false;
  action.disabled = false;
  action.onclick = () => void startFromButton(options);
  action.focus({preventScroll:true});
}
async function startFromButton({startSession=false,replay=false,resumeBreak=false}={}){
  if(busy || abortPending)return;
  busy = true;
  const button = startSession ? $('begin') : $('trialAction');
  const status = startSession ? $('soundStatus') : $('trialNotice');
  button.disabled = true;
  try {
    // Audio must be unlocked from the original click, before waiting for an API.
    await enableCues();
    if(abortPending)return;
    if(startSession)view = await api('/api/experiment/start');
    if(resumeBreak)view = await api('/api/experiment/break');
  }catch(error){
    if(!abortPending)status.textContent = error.message;
    return;
  }finally{
    busy = false;
    button.disabled = false;
  }
  await runPresentation(replay);
}
function stopHardwareHeartbeat(){if(hardwareHeartbeat)clearInterval(hardwareHeartbeat);hardwareHeartbeat=0;hardwareHeartbeatGeneration++}
async function checkHardwareHeartbeat(){
  if(view?.hardware_mode!=='hardware')return;
  const generation=hardwareHeartbeatGeneration;
  try{
    const result=await api('/api/experiment/heartbeat');
    if(result.active!==true)throw new Error('実機の操作権が失われました。実験者にお知らせください。');
  }catch(error){if(generation===hardwareHeartbeatGeneration)hardwareHeartbeatError=error;throw error}
}
function startHardwareHeartbeat(){
  if(view?.hardware_mode!=='hardware'||hardwareHeartbeat)return;
  hardwareHeartbeat=setInterval(async()=>{
    if(hardwareHeartbeatPending)return;
    hardwareHeartbeatPending=true;
    const generation=hardwareHeartbeatGeneration;
    try{await checkHardwareHeartbeat()}catch{if(generation===hardwareHeartbeatGeneration)stopHardwareHeartbeat()}finally{hardwareHeartbeatPending=false}
  },500);
}
function delay(ms,onTick){
  return new Promise((resolve,reject)=>{
    const started=performance.now();
    function tick(){
      if(abortPending){reject(new Error('実験を中断しました。'));return}
      if(hardwareHeartbeatError){reject(new Error('実機との接続が途切れました。実験者にお知らせください。'));return}
      const remaining=Math.max(0,ms-(performance.now()-started));
      if(onTick)onTick(remaining);
      if(remaining===0){resolve();return}
      setTimeout(tick,Math.min(100,remaining));
    }
    tick();
  });
}
function showPresentationPhase(label,durationMs=null,remainingMs=durationMs){
  const phase=$('presentationPhase'),countdown=$('phaseCountdown'),bar=$('phaseProgress');
  if(!phase||!countdown||!bar)return;
  if(phase.textContent!==label)phase.textContent=label;
  bar.setAttribute('aria-label',label+'の残り時間');
  if(durationMs===null){
    countdown.textContent='処理中';bar.removeAttribute('value');
    bar.setAttribute('aria-valuetext','処理中');
    return;
  }
  const remaining=Math.max(0,Math.min(durationMs,remainingMs));
  const seconds=(Math.ceil(remaining/100)/10).toFixed(1);
  countdown.textContent='残り '+seconds+' 秒';
  bar.max=durationMs;bar.value=remaining;
  bar.setAttribute('aria-valuetext','残り '+seconds+' 秒');
}
async function waitPresentationPhase(label,ms){
  showPresentationPhase(label,ms,ms);
  await delay(ms,remaining=>showPresentationPhase(label,ms,remaining));
}
async function recordEvent(name){
  if(abortPending)throw new Error('実験を中断しました。');
  if(hardwareHeartbeatError)throw hardwareHeartbeatError;
  await api('/api/experiment/trial/event',{event:name});
  if(abortPending)throw new Error('実験を中断しました。');
}
async function runPresentation(replay=false){
  if(busy || abortPending)return;
  busy = true;
  let trialStarted = false;
  showTrialScreen();
  clearAnswer();
  $('trialAction').hidden = true;
  $('phaseTiming').hidden = false;
  $('trialNotice').textContent = '';
  showPresentationPhase('準備しています');
  try {
    stopHardwareHeartbeat();
    hardwareHeartbeatError = null;
    const stimulus = await api('/api/experiment/trial/start',{replay,protocol_version:view.presentation_protocol?.version});
    trialStarted = true;
    const practice = stimulus.kind === 'practice';
    await recordEvent('instruction');
    startHardwareHeartbeat();
    playCue('start');
    const instruction = view.hardware_mode === 'hardware' ? 'ロボットの目を見てください' : '提示までお待ちください';
    await waitPresentationPhase(practice ? '練習 · '+instruction : instruction,2000);
    showPresentationPhase('表情への移行を開始しています');
    await recordEvent('baseline');
    await recordEvent('transition');
    await waitPresentationPhase('表情へ移行中',500);
    showPresentationPhase('表情の保持を開始しています');
    await recordEvent('target');
    await waitPresentationPhase('表情を表示中',5000);
    showPresentationPhase('基準への復帰を開始しています');
    await recordEvent('return');
    await waitPresentationPhase('基準に戻しています',500);
    showPresentationPhase('回答を準備しています');
    await checkHardwareHeartbeat();
    await recordEvent('response');
    playCue('answer');
    showAnswer(practice,0,stimulus.presentation_id);
  }catch(error){
    stopHardwareHeartbeat();
    hardwareHeartbeatError = null;
    if(!abortPending){
      if(trialStarted)await api('/api/experiment/error',{message:error.message}).catch(()=>{});
      showError(error.message);
    }
  }finally{
    busy = false;
  }
}
function showAnswer(practice,elapsedMs=0,presentationId=answerPresentationId){
  showTrialScreen();
  clearAnswer();
  answerPresentationId = presentationId;
  $('trialAction').hidden = true;
  $('phaseTiming').hidden = true;
  $('presentationPhase').textContent = (practice?'練習の回答':'回答中')+' · 時間制限なし';
  $('trialNotice').textContent = '';
  responseStarted = performance.now()-Math.max(0,Number(elapsedMs)||0);
  setAnswerControls(true);
  $('trialQuestion').focus({preventScroll:true});
}
async function submitAnswer(){
  if(busy || abortPending || !answerPresentationId || selectedEmotion === null
      || (selectedEmotion !== 'other' && selectedConfidence === null))return;
  busy = true;
  setAnswerControls(false);
  $('trialNotice').textContent = '回答を保存しています…';
  // A reloaded answer page may need a new click to unlock audio.
  const audioReady = cueAudio?.state === 'running' ? null : enableCues().catch(() => {});
  try {
    view = await api('/api/experiment/answer',{
      presentation_id:answerPresentationId,perceived_emotion:selectedEmotion,
      confidence:selectedEmotion==='other'?null:selectedConfidence,response_latency_ms:responseLatency
    });
    if(abortPending)return;
    if(view.status === 'completed'){stopHardwareHeartbeat();renderComplete();return}
    if(view.needs_break){stopHardwareHeartbeat();renderBreak();return}
    if(audioReady)await audioReady;
    if(abortPending)return;
    if(cueAudio?.state !== 'running'){
      offerTrialAction('回答を保存しました。','次の試行のため通知音を有効にしてください。','音を有効にして続ける');
      return;
    }
  }catch(error){
    if(!abortPending)showError(error.message);
    return;
  }finally{
    busy = false;
  }
  await runPresentation();
}
function renderBreak(){
  offerTrialAction('休憩',`${view.progress.completed} / ${view.progress.total} 回が終わりました。`,'再開する',{resumeBreak:true});
}
function renderComplete(){updateProgress();setScreen(`<h1>終了しました</h1><p>回答を保存しました。ご協力ありがとうございました。</p><label class="muted" for="freeText">コメント（任意）</label><textarea id="freeText" class="textarea" maxlength="2000" placeholder="気になった点があれば入力してください"></textarea><div class="actions"><button class="button" id="finish">終了する</button></div><div id="finishStatus" class="status" role="status"></div>`);$('finish').onclick=async()=>{if(busy)return;busy=true;try{await api('/api/experiment/feedback',{free_text:$('freeText').value});$('finishStatus').textContent='保存しました。この画面を閉じてください。';$('finish').disabled=true}catch(error){$('finishStatus').textContent=error.message}finally{busy=false}}}
async function abortSession(){if(abortPending||!confirm('実験を中断しますか？ ここまでの記録は保存されます。'))return;abortPending=true;stopHardwareHeartbeat();try{view=await api('/api/experiment/abort');renderState()}catch(error){showError(error.message)}}
window.addEventListener('pagehide',()=>{stopHardwareHeartbeat();if(view?.hardware_mode==='hardware')fetch('/api/experiment/hardware/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,access}),keepalive:true}).catch(()=>{})});
load();
</script>
</body>
</html>
