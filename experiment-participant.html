<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Aria · 感情認識実験</title>
<link rel="stylesheet" href="/experiment.css">
</head>
<body>
<header><div class="header-inner"><div class="brand">ARIA <span class="muted">実験参加</span></div><span class="tag">ローカルモック · 実機指令なし</span><div id="progress" class="progress"></div></div></header>
<div class="page-title"><div class="page-title-inner"><h1>感情認識実験</h1></div></div>
<main><section class="screen" id="screen" aria-live="polite"><p>セッションを読み込んでいます…</p></section></main>
<footer>参加は任意です。いつでも中断できます。</footer>
<script>
const $=id=>document.getElementById(id);const query=new URLSearchParams(location.search);const sessionId=query.get('session')||'';const access=new URLSearchParams(location.hash.slice(1)).get('access')||'';let view=null;let busy=false;let abortPending=false;let responseStarted=0;let responseLatency=null;let selectedEmotion=null;let selectedConfidence=null;
const answers=[['anger','怒っている'],['disgust','嫌がっている（嫌悪）'],['fear','怖がっている'],['joy','喜んでいる'],['sadness','悲しんでいる'],['surprise','驚いている'],['neutral','特に感情を感じない'],['other','その他・わからない']];
async function api(path,body={}){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,access,...body})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||`HTTP ${response.status}`);return result}
async function load(){if(!sessionId||!access){showError('参加者リンクが不足しています。管理者から受け取ったリンクを開いてください。');return}try{view=await api('/api/experiment/session/state');updateProgress();renderState()}catch(error){showError(error.message)}}
function updateProgress(){if(!view)return;const done=view.progress.completed;const max=view.progress.total;$('progress').textContent=done?`Trial ${Math.min(done+1,max)} / ${max}`:''}
function setScreen(html){$('screen').innerHTML=html;window.scrollTo({top:0,behavior:'auto'});const focusTarget=$('screen').querySelector('h1,h2,button,input');if(focusTarget){if(/^H[12]$/.test(focusTarget.tagName))focusTarget.tabIndex=-1;focusTarget.focus({preventScroll:true})}}
function showError(message,canRetry=true){setScreen(`<div class="eyebrow">接続を確認してください</div><h1>一時停止中</h1><div class="error" role="alert"></div><div class="actions"><button class="button secondary" id="reload">画面を再読み込み</button>${canRetry?'<button class="button" id="retry">続ける</button>':''}</div>`);$('screen').querySelector('.error').textContent=message;$('reload').onclick=()=>location.reload();if($('retry'))$('retry').onclick=()=>void load()}
function renderState(){if(view.status==='declined'){setScreen('<h1>同意は記録されませんでした</h1><p>参加しない選択を記録しました。この画面を閉じてください。</p>');return}if(view.status==='aborted'){setScreen('<h1>セッションを中断しました</h1><p>ここまでの状態は保存されています。実験者にお知らせください。</p>');return}if(view.status==='completed'){renderComplete();return}if(!view.consented){renderConsent();return}if(view.active){renderRecovery(view.active);return}if(view.needs_break){renderBreak();return}if(view.status==='consented'){renderWelcome();return}if(!view.practice_done){renderNext('練習','まず1回、操作と回答の流れを練習します。練習の回答は本試行データに含まれません。');return}if(view.progress.completed>=view.progress.total){renderComplete();return}renderNext(`Trial ${view.progress.completed+1} / ${view.progress.total}`,'準備ができたら次へ進んでください。途中で休みたい場合は実験者にお知らせください。')}
function renderConsent(){setScreen(`<div class="eyebrow">研究への参加について</div><h1>目の表情を見て、感じたことを答えてください</h1><p>ロボットの目の表情がどのような気持ちに見えるかを調べます。提示のあと、見えた感情と回答への自信を選びます。正解・不正解のフィードバックはありません。</p><p class="notice">この画面はローカルのモックです。実機には接続せず、入力内容は動作確認用にローカル保存します。</p><ul class="list"><li>記録するのは参加者ID、回答、確信度、回答時間、提示条件です。</li><li>氏名、映像、音声は記録しません。</li><li>参加は任意で、いつでも中断できます。中断しても不利益はありません。</li></ul><label class="checkbox"><input id="consentCheck" type="checkbox"><span>説明を読み、参加に同意します。</span></label><div class="actions"><button class="button" id="accept" disabled>同意して進む</button><button class="button secondary" id="decline">同意しない</button></div>`);const check=$('consentCheck');const accept=$('accept');check.addEventListener('change',()=>accept.disabled=!check.checked);accept.onclick=async()=>{if(busy||!check.checked)return;busy=true;accept.disabled=true;try{view=await api('/api/experiment/consent',{accepted:true});renderWelcome()}catch(error){showError(error.message)}finally{busy=false}};$('decline').onclick=async()=>{if(busy)return;busy=true;try{view=await api('/api/experiment/consent',{accepted:false});renderState()}catch(error){showError(error.message)}finally{busy=false}}}
function renderWelcome(){setScreen(`<div class="eyebrow">開始前の案内</div><h1>ロボットの目を見てください</h1><p>このモックでは画面上に目を表示せず、実機も動かしません。1回の練習のあと、42回の提示手順を確認します。14回ごとに休憩画面が入ります。回答に時間制限はありません。</p><p class="muted">画面を再読み込みしても、進行状況は保存されています。</p><div class="actions"><button class="button" id="begin">説明を確認して開始</button><button class="button secondary" id="withdraw">中断</button></div>`);$('begin').onclick=async()=>{if(busy)return;busy=true;try{view=await api('/api/experiment/start');renderNext('練習','まず1回、操作と回答の流れを練習します。練習の回答は本試行データに含まれません。')}catch(error){showError(error.message)}finally{busy=false}};$('withdraw').onclick=()=>void abortSession()}
function renderNext(title,description){updateProgress();setScreen(`<div class="eyebrow">${title}</div><h1>準備ができたら「次へ」を押してください</h1><p>${description}</p><div class="actions"><button class="button" id="next">次へ</button><button class="button secondary" id="withdraw">中断</button></div>`);$('next').onclick=()=>void runPresentation();$('withdraw').onclick=()=>void abortSession()}
function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function recordEvent(name){await api('/api/experiment/trial/event',{event:name})}
async function runPresentation(replay=false){if(busy||abortPending)return;busy=true;try{const stimulus=await api('/api/experiment/trial/start',{replay});const practice=stimulus.kind==='practice';setScreen(`<div class="eyebrow">${practice?'練習':`Trial ${stimulus.progress.completed+1} / ${stimulus.progress.total}`}</div><div class="presentation"><h1>提示手順を確認しています</h1><p class="phase-label" role="status">ローカルモックのため、画面にも実機にも目は表示しません。</p></div><div class="actions"><button class="button secondary" id="withdraw">中断</button></div>`);$('withdraw').onclick=()=>void abortSession();await recordEvent('instruction');if(abortPending)return;await delay(1000);if(abortPending)return;await recordEvent('baseline');if(abortPending)return;await delay(500);if(abortPending)return;await recordEvent('transition');if(abortPending)return;await delay(500);if(abortPending)return;await recordEvent('target');if(abortPending)return;await delay(3000);if(abortPending)return;await recordEvent('return');if(abortPending)return;await delay(500);if(abortPending)return;await recordEvent('response');if(abortPending)return;showAnswer(practice)}catch(error){if(!abortPending){await api('/api/experiment/error',{message:error.message}).catch(()=>{});showError(`${error.message} 同じ提示枠から再開できます。`)}}finally{busy=false}}
function showAnswer(practice){selectedEmotion=null;selectedConfidence=null;responseLatency=null;setScreen(`<div class="eyebrow">${practice?'練習の回答':`Trial ${view.progress.completed+1} / ${view.progress.total}`}</div><h2>今提示された目の表情について、ロボット自身がどのような気持ちに見えましたか？</h2><div class="choices" role="group" aria-label="感情の回答">${answers.map(([id,label])=>`<button type="button" class="choice" data-emotion="${id}" aria-pressed="false">${label}</button>`).join('')}</div><div class="confidence hidden" id="confidence"><h3>その回答に、どのくらい自信がありますか？</h3><div class="confidence-list" role="group" aria-label="確信度">${[['1','ほとんど自信がない'],['2','あまり自信がない'],['3','やや自信がある'],['4','とても自信がある']].map(([value,label])=>`<button type="button" class="choice" data-confidence="${value}" aria-pressed="false">${value} · ${label}</button>`).join('')}</div></div><div class="actions"><button class="button" id="submitAnswer" disabled>回答を選択してください</button><button class="button secondary" id="withdraw">中断</button></div>`);responseStarted=performance.now();$('withdraw').onclick=()=>void abortSession();document.querySelectorAll('[data-emotion]').forEach(button=>button.addEventListener('click',()=>{selectedEmotion=button.dataset.emotion;responseLatency=Math.max(0,Math.round(performance.now()-responseStarted));document.querySelectorAll('[data-emotion]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));const confidence=$('confidence');if(selectedEmotion==='other'){confidence.classList.add('hidden');selectedConfidence=null;$('submitAnswer').disabled=false;$('submitAnswer').textContent='回答を確定'}else{confidence.classList.remove('hidden');$('submitAnswer').disabled=true;$('submitAnswer').textContent='確信度を選択してください'}}));document.querySelectorAll('[data-confidence]').forEach(button=>button.addEventListener('click',()=>{selectedConfidence=Number(button.dataset.confidence);document.querySelectorAll('[data-confidence]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));$('submitAnswer').disabled=false;$('submitAnswer').textContent='回答を確定'}));$('submitAnswer').onclick=()=>void submitAnswer(practice)}
async function submitAnswer(practice){if(busy||selectedEmotion===null||(selectedEmotion!=='other'&&selectedConfidence===null))return;busy=true;$('submitAnswer').disabled=true;try{view=await api('/api/experiment/answer',{perceived_emotion:selectedEmotion,confidence:selectedEmotion==='other'?null:selectedConfidence,response_latency_ms:responseLatency});if(view.status==='completed'){renderComplete();return}if(view.needs_break){renderBreak();return}if(practice){renderNext(`Trial 1 / ${view.progress.total}`,'練習はここまでです。続けて本試行を行います。練習の回答は本試行データに含まれません。')}else{renderNext(`Trial ${view.progress.completed+1} / ${view.progress.total}`,'回答を保存しました。準備ができたら次へ進んでください。')}}catch(error){showError(error.message)}finally{busy=false}}
function renderRecovery(active){setScreen(`<div class="eyebrow">進行状況を保存しました</div><h1>提示を再開しますか？</h1><p>画面を開き直したため、現在の提示は最初からやり直します。前の試行は再提示として記録されます。</p><p class="muted">再提示時も同じ条件を使い、回答は最後に完了したものを記録します。</p><div class="actions"><button class="button" id="resume">同じ提示を最初から見る</button><button class="button secondary" id="withdraw">中断</button></div>`);$('resume').onclick=()=>void runPresentation(true);$('withdraw').onclick=()=>void abortSession()}
function renderBreak(){setScreen(`<div class="eyebrow">休憩</div><h1>ここで少し休憩してください</h1><p>ここまで ${view.progress.completed} / ${view.progress.total} 回の回答を保存しました。準備ができたら再開してください。</p><div class="actions"><button class="button" id="resumeBreak">実験を再開</button><button class="button secondary" id="withdraw">中断</button></div>`);$('resumeBreak').onclick=async()=>{if(busy)return;busy=true;try{view=await api('/api/experiment/break');renderNext(`Trial ${view.progress.completed+1} / ${view.progress.total}`,'休憩を記録しました。準備ができたら次へ進んでください。')}catch(error){showError(error.message)}finally{busy=false}};$('withdraw').onclick=()=>void abortSession()}
function renderComplete(){updateProgress();setScreen(`<div class="eyebrow">完了</div><h1>ご協力ありがとうございました</h1><p>すべての回答を保存しました。</p><label class="muted" for="freeText">任意のコメント</label><textarea id="freeText" class="textarea" maxlength="2000" placeholder="気づいたことがあれば入力してください"></textarea><div class="actions"><button class="button" id="finish">コメントを保存して終了</button></div><div id="finishStatus" class="status" role="status"></div>`);$('finish').onclick=async()=>{if(busy)return;busy=true;try{await api('/api/experiment/feedback',{free_text:$('freeText').value});$('finishStatus').textContent='保存しました。この画面を閉じてください。';$('finish').disabled=true}catch(error){$('finishStatus').textContent=error.message}finally{busy=false}}}
async function abortSession(){if(abortPending||!confirm('実験を中断しますか？ ここまでの記録は保存されます。'))return;abortPending=true;try{view=await api('/api/experiment/abort');renderState()}catch(error){abortPending=false;showError(error.message)}}
load();
</script>
</body>
</html>
